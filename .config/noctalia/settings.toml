config_version = 13

[backdrop]
blur_intensity = 0.29999999329447746
enabled = true
tint_intensity = 0.14999999664723873

[bar.default]
background_opacity = 0.0
border = "surface_variant"
capsule = true
capsule_opacity = 0.89999997988343239
capsule_padding = 8.0
capsule_radius = 8
capsule_thickness = 0.64999998919665813
center = [ "clock", "workspaces" ]
color = "secondary"
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
font_family = "Noto Sans"
font_weight = 600
margin_ends = 0
padding = 25
panel_overlap = 0
position = "bottom"
radius = 0
shadow = false
start = [ "control-center", "launcher", "wallpaper", "media", "audio_visualizer" ]
thickness = 36

[location]
address = "Meßstetten, Germany"

[lockscreen_widgets]
